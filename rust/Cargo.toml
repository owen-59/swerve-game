[package]
name = "swerve-drive-rust-lib"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
nalgebra = "0.35.0"
# godot = "0.5.5"
# nalgebra = "0.35.0"

[dependencies.godot]
git = "https://github.com/godot-rust/gdext"
branch = "master"
features = ["api-custom", "experimental-wasm", "lazy-function-tables"]

